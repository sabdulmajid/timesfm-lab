probe:
  # Run with CUDA_VISIBLE_DEVICES=1 and --physical-gpu-index 1. The visible
  # process-local device must remain cuda:0.
  physical_gpu_index: 1
  device: cuda:0
  require_isolated_visible_device: true
  require_bfloat16: true
  variant: compact_kd4
  variants: [compact_kd4]
  # Required by the shared real-cache validator; the per-shape primary and
  # secondary batches below are the only sizes this probe executes.
  batch_sizes: [16, 32, 64]
  warmup_steps: 2
  measured_steps: 5
  secondary_measured_steps: 3
  plateau_tolerance_fraction: 0.03
  first_compile_timeout_seconds: 600
  minimum_conservative_speedup: 1.08

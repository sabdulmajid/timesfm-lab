  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_clip: 1.0

  compile:
    backend: inductor
    mode: default
    fullgraph: true
    dynamic: true
    # A new temporary cache is used for every invocation so cold-start timing
    # cannot silently benefit from a previous local compilation.
    fresh_temporary_cache: true
    maximum_unique_graphs_per_shape: 1

  correctness:
    output_atol: 0.002

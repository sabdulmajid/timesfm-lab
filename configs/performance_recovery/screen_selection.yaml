development_evaluation:
  validation_implementation: scripts/train_production_student.py
  evaluation_runner: scripts/evaluate_recovery_development.py
  evaluation_runner_sha256: 2cf14b7d4781467a61fb26e1c60f3fc9fe1eb6d5eec534a53c693fec35f9f7ac
  # S5 may change only training reduction. Everything else in the trainer AST,
  # including imports, globals, preprocessing, inference, and validation, is bound.
  validation_semantic_excluded_training_symbols: [_loss, main]
  validation_semantics_sha256: eba65156cf2c5c4f774d80626e569ae625ff271dcf9df621c238eadbaf51a5da
  # S5 may change the training-only loss container. Every other source file is
  # byte-exact; imports/globals and all non-excluded definitions in this file
  # are AST-bound, including _masked_mean and pinball_loss used by validation.
  model_source_semantic_exceptions:
    - path: src/timesfm_lab/distill/losses.py
      excluded_symbols: [LossWeights, DistillationLoss]
  model_evaluation_source_sha256: e05cebbe21130041d70dcf0679271719fdf54164e0df07692d7127cb3fda6fb7
  input_preprocessing: timesfm3_linear_interpolation
  validation_partition: development
  batch_size_by_context:
    '8192': 32
    '4096': 64
    '2048': 64
    '512': 256
    '256': 256
    '128': 256
    '64': 256
    '32': 256
    '8': 256

candidate_scope:
  source: every ledger candidate with terminal succeeded status
  maximum_substantive_screens: 6
  maximum_finalists: 2
  terminal_failed_and_unlaunched_slots_are_retained_in_the_audit: true
  compact_attribution_pair: [S3, S4]

development_metrics:
  overall_dev_mase_like: student_normalized_median_mae
  overall_dev_mwql_like: student_pinball
  true_mv_dev_mase_like: true_mv_student_normalized_median_mae
  true_mv_dev_mwql_like: true_mv_student_pinball
  caveat: >-
    The median term is normalized median MAE on GiftEvalPretrain development
    windows, not benchmark MASE. The probabilistic term is normalized pinball
    loss, not benchmark MWQL. These are development selection proxies only.

score:
  type: weighted_geometric_mean_of_ratios_to_incumbent
  direction: lower_is_better
  weights:
    overall_dev_mase_like: 0.30
    overall_dev_mwql_like: 0.30
    true_mv_dev_mase_like: 0.15
    true_mv_dev_mwql_like: 0.15
    aggregate_end_to_end_latency_ms: 0.10
  tie_breakers: [overall_dev_mwql_like, parameter_count, candidate_id]

latency_evidence:
  schema_version: 1
  partition: development
  implementation: scripts/benchmark_recovery_development_latency.py
  implementation_sha256: 66f6bc6b415e148a0a4afc87c3fa26bcb1ea3ca62dee69f9e55fa667edb11a46
  workload_config: configs/performance_recovery/development_latency.yaml
  statistic: aggregate_end_to_end_latency_ms
  require_checkpoint_binding: true
  require_same_workload_manifest_for_every_model: true
  require_confirmation_partition_accessed: false
  require_gift_eval_data_accessed: false
  minimum_warmup_calls_per_workload: 5
  minimum_measured_calls_per_workload: 20
  require_synchronize_each_sample: true
  require_single_gpu_no_contention: true

confirmation_embargo:
  required_during_screen_audit: frozen_uninspected
  selection_may_not_read_confirmation_metrics: true
  finalist_freeze_does_not_itself_read_confirmation: true
  post_freeze_policy: >-
    Freeze the complete finalist recipe/seed/checkpoint roster before the first
    confirmation target is read. Confirmation is never used to revise recipes,
    training budgets, or development-selected checkpoint steps.

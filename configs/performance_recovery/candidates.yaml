        sha256: 7516cd3fac9d1aafe96e33fa5b0de7e3eb713c73a4f8b32fe8101c7230113cc4
        size_bytes: 346717599
    activation_gate: >-
      On the selected base, geometrically aggregate each domain's step-5000 over
      step-0 ratios for student pinball and normalized median MAE. Activate only
      if the geometric mean ratio over Econ/Fin, Energy, Healthcare, Sales, and
      Web/CloudOps is at least 1.03 times the ratio over Nature and Transport,
      and at least one of S3 or S4 improves overall balanced_forecast_error.
    single_changed_factor: per_window_domain_balanced_training_reduction
    domain_weights_source:
      rule: >-
        raw_w_d=clip((1/7)/p_d,0.5,2.0), normalized to unit mean over
        outer-training windows; p_d uses all frozen outer-training windows and
        does not depend on target values or missingness.
      outer_training_identity_sha256: 24cad944c659cfe437f54b0050dac19fa9698ff45e43ce31907ac8caf824b9f4
      counts_include_zero_target_windows:

  grandfathering_policy: >-
    These records remain governed by their v1.1 launch-time registry, target,
    code, and input hashes. Selection must verify those hashes from the named
    launch commit; it must not rewrite them to v1.2 or accept any unlisted
    protocol mismatch. All launches after this amendment use v1.2.
  ledger_transition: >-
    Keep the active v1.1 GPU ledger untouched until all grandfathered running
    jobs reconcile. Before any v1.2 launch, write an explicit migration that
    preserves every prior entry and its registry/hash provenance, then binds
    the v1.2 registry. Silent replacement is forbidden.

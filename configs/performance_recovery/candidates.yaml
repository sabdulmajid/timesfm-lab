    validation_partition: development
    confirmation_partition_accessed: false

candidates:
  S1:
    family: recipe
    launchable: true
    hypothesis: >-
      A lower-learning-rate continuation from the validation-selected GT incumbent
      can recover forecast accuracy without changing the compact architecture.
    config: configs/distillation/performance_recovery_legacy_screen.yaml
    variant: legacy_gt_lowlr
    parameter_count: 29499264
    initialization:
      kind: checkpoint
      path: checkpoints/production-1m/gt/student-gt-best.pt
      file_sha256: 959dd679274f08e3f4377dbbf3fa48db011208baa735620bac06ab1ede9a0b24
      loaded_state_sha256: f55c0c6d883a335bd3d0ba37dd6f9d18b7d5c6119f7736803368d4aa00393385
    throughput_measurement:
      windows_per_second: 1395.7177585326217
      source: results/reproduction/distillation/production-1m-student-gt-seed42.json
      source_sha256: f3f92b92b6adc94fdc89ccb6b231b08c921aaaf73a46f1e41ae6d6dd382e7570
      json_pointer: /extra/training/windows_per_second
      basis: same legacy architecture, corpus, physical batches, BF16, and one GPU
      estimated_gpu_hours: 3.033
    checkpoint_dir: checkpoints/performance-recovery/screens/S1
    output: results/reproduction/distillation/performance-recovery-screen-S1.json
    log: results/raw/performance-recovery-screen-S1.log

  S2:
    family: recipe
    launchable: true
    hypothesis: >-
      Raising output-KD weight to 4 makes teacher pressure approximately one third
      of the observed objective scale and can improve on GT continuation.
    config: configs/distillation/performance_recovery_legacy_screen.yaml
    variant: legacy_kd4_lowlr
    parameter_count: 29499264
    initialization:
      kind: checkpoint
      path: checkpoints/production-1m/gt/student-gt-best.pt
      file_sha256: 959dd679274f08e3f4377dbbf3fa48db011208baa735620bac06ab1ede9a0b24
      loaded_state_sha256: f55c0c6d883a335bd3d0ba37dd6f9d18b7d5c6119f7736803368d4aa00393385
    throughput_measurement:
      windows_per_second: 1370.3870657911211
      source: results/reproduction/distillation/production-1m-student-kd-seed42.json
      source_sha256: a537bada95400070c1fd7cfdc544ed604c207a71bf5610603a934998bec08fd8
      json_pointer: /extra/training/windows_per_second
      basis: same legacy architecture, corpus, KD computation, BF16, and one GPU
      estimated_gpu_hours: 3.087
    checkpoint_dir: checkpoints/performance-recovery/screens/S2
    output: results/reproduction/distillation/performance-recovery-screen-S2.json
    log: results/raw/performance-recovery-screen-S2.log

  S3:
    family: architecture
    launchable: true
    hypothesis: >-
      A teacher-shaped future-patch decoder, RoPE temporal positions, detrending,
      and stitching remove bottlenecks in the last-token head; iterative CPM RevIN
      is excluded because the pinned implementation produced nonfinite gradients.
    config: configs/distillation/performance_recovery_compact_screen.yaml
    variant: compact_gt
    parameter_count: 28860480
    initialization:
      kind: seeded_random
      state_sha256: ca585678134535639b287ec295347d5103a0f1e21229d44f60913f5495c8f530
    throughput_measurement: null
    checkpoint_dir: checkpoints/performance-recovery/screens/S3
    output: results/reproduction/distillation/performance-recovery-screen-S3.json
    log: results/raw/performance-recovery-screen-S3.log

  S4:
    family: architecture
    launchable: true
    hypothesis: >-
      Diagnosis-scaled output KD improves the compact future-patch decoder beyond
      its matched GT control under identical initialization and sample order.
    config: configs/distillation/performance_recovery_compact_screen.yaml
    variant: compact_kd4
    parameter_count: 28860480
    initialization:
      kind: seeded_random
      state_sha256: ca585678134535639b287ec295347d5103a0f1e21229d44f60913f5495c8f530
    throughput_measurement: null
    checkpoint_dir: checkpoints/performance-recovery/screens/S4
    output: results/reproduction/distillation/performance-recovery-screen-S4.json
    log: results/raw/performance-recovery-screen-S4.log

  S5:
    family: distillation
    launchable: false
    hypothesis: representation_assisted_kd
    activation_gate: requires a committed real-data representation probe and configuration

  S6:
    family: conditional
    launchable: false
    hypothesis: capacity_probe_only_if_diagnostics_support_it
    activation_gate: requires committed evidence of a capacity-limited plateau

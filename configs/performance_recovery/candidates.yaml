  S2:
    family: recipe
    launchable: true
    hypothesis: >-
      Raising output-KD weight to 4 makes teacher pressure approximately one third
      of the observed objective scale and can improve on GT continuation.
    config: configs/distillation/performance_recovery_legacy_screen.yaml
    variant: legacy_kd4_lowlr
    parameter_count: 29499264
    initialization:
      kind: checkpoint
      path: checkpoints/production-1m/gt/student-gt-best.pt

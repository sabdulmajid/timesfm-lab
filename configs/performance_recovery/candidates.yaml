        Nature: 0.7437324094220139
        Sales: 2.366550935229951
        Transport: 0.5916377338074877
        Web/CloudOps: 2.366550935229951
    matching_requirements: >-
      Copy the selected base's architecture, exact GT/KD coefficients,
      initialization, window order, optimizer, schedule, precision, 50000-step
      ceiling, validation, and deployment path. Only the training reducer and

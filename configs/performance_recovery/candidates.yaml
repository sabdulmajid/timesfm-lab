    log: results/raw/performance-recovery-screen-S4.log

  S5:
    family: recipe
    launchable: true
    hypothesis: >-
      Equal-window loss reduction plus bounded, target-blind inverse-domain
      weighting improves broad development forecasting when the production
      elementwise reducer overweights high-variate, long-horizon domains.
    protocol_amendment: >-
      S5 replaces the previously reserved representation-assisted-KD slot. This
      amendment was frozen before either compact screen reached step 5000.
    base_selection:
      checkpoint_step: 5000
      candidates: [S3, S4]
      metric: balanced_forecast_error
      direction: lower
      tie_breaker: S3
      preserve_selected_objective_exactly: true
    activation_evidence:
      status: passed
      path: results/reproduction/distillation/performance-recovery-s5-activation-gate.json
      sha256: 0b6d740f4968a641b6fcf134ed29b870cc25649daaa01d80de0614d98b5392c8
      gate_time_registry_sha256: d4e39f9fdac0818e19c901a882429ec5570c691c27480bc114a4b8a8950abd30
      outcome: activate_S5
      selected_candidate: S3
      selected_variant: compact_gt
      checkpoint_step: 5000
      selected_checkpoint:
